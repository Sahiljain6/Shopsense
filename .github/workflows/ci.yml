name: CI/CD
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shopsense
          POSTGRES_PASSWORD: shopsense
          POSTGRES_DB: shopsense
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend tests && black --check backend tests
      - run: pytest
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci.db
          PYTHONPATH: ${{ github.workspace }}
      - run: cd frontend && npm install && npm test && npm run build
      - run: docker build -f docker/backend.Dockerfile . && docker build -f docker/frontend.Dockerfile .
      - name: Deploy to Render
        if: github.ref == 'refs/heads/main' && env.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

name: Continuous Integration

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  frontend-build-test:
    name: Frontend Build & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit test suite
        run: npm test

      - name: Run Vite production build
        run: npm run build

  backend-test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest tests
        env:
          DATABASE_URL: "sqlite:///./test.db"
          JWT_SECRET: "test-jwt-secret-key-32-chars-long"
        run: |
          pytest -v

  live-site-smoke-audit:
    name: Live ShopSense Website Smoke Audit
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'qa/live-site-smoke-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install disposable Playwright runtime
        run: |
          mkdir -p "$RUNNER_TEMP/shopsense-audit"
          npm install --prefix "$RUNNER_TEMP/shopsense-audit" --no-save playwright
          "$RUNNER_TEMP/shopsense-audit/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run read-only public website and API audit
        run: node scripts/live-site-audit.mjs
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          SHOPSENSE_API_URL: https://shopsense-api-pb2g.onrender.com
          SHOPSENSE_FRONTEND_CANDIDATES: https://shopsense-4444.vercel.app,https://shopsense.vercel.app,https://shopsense-gmeelq7ml-sahil-jain-s-projects.vercel.app,https://shopsense-4444-l2msp2txf-sahil-jain-s-projects.vercel.app
          AUDIT_ARTIFACT_DIR: artifacts/live-site-audit

      - name: Upload browser screenshots and JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopsense-live-site-audit
          path: artifacts/live-site-audit/
          if-no-files-found: warn
          retention-days: 14


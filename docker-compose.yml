services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shopsense
      POSTGRES_PASSWORD: shopsense
      POSTGRES_DB: shopsense
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://shopsense:shopsense@db:5432/shopsense
    ports: ["8000:8000"]
    depends_on: [db]
    volumes: ["./backend:/app"]
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:

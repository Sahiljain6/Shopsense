services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shopsense
      POSTGRES_PASSWORD: shopsense
      POSTGRES_DB: shopsense
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://shopsense:shopsense@db:5432/shopsense
      PARBAD_MODE: virtual
      PARBAD_PUBLIC_BASE_URL: http://localhost:8081
      PARBAD_INTERNAL_KEY: ${PARBAD_INTERNAL_KEY:-local-only-parbad-key-change-this-outside-dev-32chars}
      PARBAD_ALLOW_VIRTUAL_IN_PRODUCTION: "false"
    ports: ["8000:8000"]
    depends_on: [db]
    volumes: ["./backend:/app"]
  parbad-payment:
    build:
      context: .
      dockerfile: docker/parbad-payment.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PARBAD_MODE: virtual
      PARBAD_PUBLIC_BASE_URL: http://localhost:8081
      SHOP_API_BASE_URL: http://backend:8000
      SHOP_FRONTEND_RETURN_URL: http://localhost:3000/
      PARBAD_INTERNAL_KEY: ${PARBAD_INTERNAL_KEY:-local-only-parbad-key-change-this-outside-dev-32chars}
      PARBAD_ALLOW_VIRTUAL_GATEWAY_IN_PRODUCTION: "false"
    ports: ["8081:8080"]
    depends_on: [backend]
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:

services:
  - type: web
    name: shopsense-api
    runtime: docker
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        value: "https://shopsense-theta.vercel.app,https://shopsense.vercel.app,https://shopsense-4444.vercel.app,https://shopsense-4444-git-main-sahil-jain-s-projects.vercel.app,https://shopsense-nv1k3jgjm-sahil-jain-s-projects.vercel.app,https://shopsense-gmeelq7ml-sahil-jain-s-projects.vercel.app"
      - key: ENABLE_MULTI_AGENT
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: shopsense-db
          property: connectionString
      - key: PINCODE_API_KEY
        sync: false
      - key: PINCODE_API_URL
        sync: false

databases:
  - name: shopsense-db
    plan: free
    databaseName: shopsense
    user: shopsense


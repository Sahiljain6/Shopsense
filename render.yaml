services:
  - type: web
    name: shopsense-api
    runtime: docker
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        value: "https://shopsense-theta.vercel.app,https://shopsense.vercel.app,https://shopsense-4444.vercel.app,https://shopsense-4444-git-main-sahil-jain-s-projects.vercel.app,https://shopsense-nv1k3jgjm-sahil-jain-s-projects.vercel.app,https://shopsense-gmeelq7ml-sahil-jain-s-projects.vercel.app"
      - key: ENABLE_MULTI_AGENT
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: shopsense-db
          property: connectionString
      - key: PINCODE_API_KEY
        sync: false
      - key: PINCODE_API_URL
        sync: false


  # Public demo frontend. It points only to the isolated sandbox API below.
  - type: web
    runtime: static
    name: shopsense-parbad-sandbox
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://shopsense-parbad-sandbox-api.onrender.com

  # Isolated ShopSense API: never shares the production database.
  - type: web
    name: shopsense-parbad-sandbox-api
    runtime: docker
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://shopsense-parbad-sandbox.onrender.com"
      - key: ENABLE_MULTI_AGENT
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: shopsense-parbad-sandbox-db
          property: connectionString
      - key: PARBAD_MODE
        value: virtual
      - key: PARBAD_PUBLIC_BASE_URL
        value: https://shopsense-parbad-payment-sandbox.onrender.com
      - key: PARBAD_INTERNAL_KEY
        generateValue: true
      # Enable simulator callbacks only on this separately hosted sandbox API.
      - key: PARBAD_ALLOW_VIRTUAL_IN_PRODUCTION
        value: "true"

  # Public Parbad Virtual Gateway. It is a payment simulator, never a real-money provider.
  - type: web
    name: shopsense-parbad-payment-sandbox
    runtime: docker
    dockerfilePath: ./docker/parbad-payment.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "10000"
      - key: PARBAD_MODE
        value: virtual
      - key: PARBAD_PUBLIC_BASE_URL
        value: https://shopsense-parbad-payment-sandbox.onrender.com
      - key: SHOP_API_BASE_URL
        value: https://shopsense-parbad-sandbox-api.onrender.com
      - key: SHOP_FRONTEND_RETURN_URL
        value: https://shopsense-parbad-sandbox.onrender.com/
      - key: PARBAD_INTERNAL_KEY
        fromService:
          name: shopsense-parbad-sandbox-api
          type: web
          envVarKey: PARBAD_INTERNAL_KEY
      - key: PARBAD_ALLOW_VIRTUAL_GATEWAY_IN_PRODUCTION
        value: "true"

databases:
  - name: shopsense-db
    plan: free
    databaseName: shopsense
    user: shopsense

  # Paid plan is intentional: this must be a separate persistent database, not live orders.
  - name: shopsense-parbad-sandbox-db
    plan: basic-256mb
    databaseName: shopsense_parbad_sandbox
    user: shopsense_parbad_sandbox
    region: oregon
